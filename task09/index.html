<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task 09 - Face Tracking Occlusion</title>
        <style>
            body {
                margin: 0;
            }
            #container {
                width: 100vw;
                height: 100vh;
                position: relative;
                overflow: hidden;
            }
            .control-btn {
                position: fixed;
                right: 20px;
                z-index: 1000;
                padding: 10px 20px;
                background: rgba(0, 0, 0, 0.7);
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 16px;
                width: 180px;
            }
            .control-btn:hover {
                background: rgba(0, 0, 0, 0.9);
            }
            #toggle-video-btn { top: 20px; }
            #toggle-mask-btn { top: 70px; }
            #toggle-occluder-btn { top: 120px; }
            #capture {
                position: fixed;
                bottom: 2vh;
                left: 50%;
                height: 12vw;
                width: 12vw;
                border: solid 2px;
                border-radius: 50%;
                transform: translateX(-50%);
                z-index: 10;
                cursor: pointer;
            }
            #preview {
                position: fixed;
                z-index: 10;
                left: 10%;
                top: 10%;
                width: 80%;
                height: 80%;
                border: solid 10px white;
                visibility: hidden;
            }
            #preview-image {
                width: 100%;
                height: 100%;
            }
            #preview-close {
                position: absolute;
                right: -5px;
                top: -5px;
                font-size: 20px;
                padding: 5px;
                color: white;
                border: solid 5px white;
                cursor: pointer;
            }
            #preview-share {
                text-align: center;
                cursor: pointer;
                background: white;
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                bottom: 10px;
                padding: 10px 30px;
                border-radius: 10px;
                border: none;
            }
        </style>
        <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
                "mindar-face-three":"../mindar/mindar-face-three.prod.js"
            }
        }
        </script>
        <script type="module" src="./main.js"></script>
    </head>
    <body>
        <button id="toggle-video-btn" class="control-btn">Приховати відео</button>
        <button id="toggle-mask-btn" class="control-btn">Показати маску</button>
        <button id="toggle-occluder-btn" class="control-btn">Показати оклюдер</button>
        <button id="capture"></button>
        <div id="preview">
            <div id="preview-close">X</div>
            <img id="preview-image"/>
            <div id="preview-share">Поділитись</div>
        </div>
        <div id="container"></div>
    </body>
</html>
