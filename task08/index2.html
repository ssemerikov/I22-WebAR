<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Домашнє завдання 08</title>
        <style>
            body {
                margin: 0;
            }
            #container {
                width: 100vw;
                height: 100vh;
                position: relative;
                overflow: hidden;
            }
            #toggle-btn {
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 1000;
                padding: 10px 20px;
                background: rgba(0, 0, 0, 0.7);
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 16px;
            }
            #toggle-btn:hover {
                background: rgba(0, 0, 0, 0.9);
            }
        </style>
        <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/",
                "three/fonts/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/fonts/",
                "mindar-face-three":"../mindar/mindar-face-three.prod.js"
            }
        }
        </script>
        <script type="module" src="./main2.js"></script>
    </head>
    <body>
        <button id="toggle-btn">Приховати відео</button>
        <div id="container"></div>
    </body>
</html>
